name: build-nro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Ensure git
        run: command -v git || (apt-get update && apt-get install -y git)

      - uses: actions/checkout@v4

      - name: Build .nro
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cansole-nx
          path: cansole-nx.nro

      - name: Publish release (download this on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CANsole NX build ${{ github.run_number }}
          body: |
            Copy `cansole-nx.nro` to `/switch/cansole-nx/` on your SD card, then open it from the Homebrew Menu (hold R while opening a game for full RAM).
          files: cansole-nx.nro
          make_latest: true

      - name: Push build log to build-logs branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/logs
          cp build.log /tmp/logs/ 2>/dev/null || echo "no build.log" > /tmp/logs/build.log
          cp cansole-nx.nro /tmp/logs/ 2>/dev/null || true
          echo "${{ job.status }} run=${{ github.run_number }} sha=${{ github.sha }}" > /tmp/logs/STATUS
          cd /tmp/logs
          git init -q
          git checkout -q -b build-logs
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "build ${{ github.run_number }}: ${{ job.status }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-logs
